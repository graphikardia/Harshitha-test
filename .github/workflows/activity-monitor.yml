name: Activity Monitor

on:
  push:
  pull_request:
  issues:
  issue_comment:
  pull_request_review:
  create:
  delete:
  fork:
  gollum:
  member:
  public:
  release:
  watch:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Record activity payload
        run: |
          mkdir -p activity-log
          cp "$GITHUB_EVENT_PATH" "activity-log/${GITHUB_EVENT_NAME}-${GITHUB_RUN_ID}.json"

      - name: Upload activity log
        uses: actions/upload-artifact@v4
        with:
          name: activity-${{ github.run_id }}
          path: activity-log/
          retention-days: 30

      - name: Detect AI-assisted edits
        id: ai
        uses: actions/github-script@v7
        with:
          script: |
            const payload = context.payload || {};
            const actor = (context.actor || '').toLowerCase();
            const intern = (process.env.INTERN_USERNAME || '').toLowerCase();

            const terms = ['copilot', 'chatgpt', 'claude', 'gemini', 'openai', 'ai tool', 'generated by ai'];
            const hits = [];

            if (actor.includes('copilot') || actor.includes('[bot]')) {
              hits.push(`Actor looks automated: ${context.actor}`);
            }

            if (payload.commits) {
              for (const commit of payload.commits) {
                const candidates = [
                  commit.author?.name,
                  commit.author?.email,
                  commit.committer?.name,
                  commit.committer?.email,
                  commit.message
                ].filter(Boolean).join(' ').toLowerCase();
                for (const term of terms) {
                  if (candidates.includes(term)) hits.push(`Commit ${commit.id.slice(0, 7)} contains '${term}' indicator`);
                }
              }
            }

            if (payload.pull_request) {
              const prText = `${payload.pull_request.title || ''}\n${payload.pull_request.body || ''}`.toLowerCase();
              for (const term of terms) {
                if (prText.includes(term)) hits.push(`PR text contains '${term}' indicator`);
              }
            }

            const internActivity = intern && actor === intern;
            const aiDetected = hits.length > 0;
            core.setOutput('detected', String(aiDetected));
            core.setOutput('intern_activity', String(internActivity));
            core.setOutput('details', aiDetected ? hits.join('; ') : 'No AI indicators found');
        env:
          INTERN_USERNAME: ${{ vars.INTERN_GITHUB_USERNAME }}

      - name: Detect recent download activity
        id: downloads
        uses: actions/github-script@v7
        with:
          script: |
            let details = [];
            let detected = false;

            if (context.eventName === 'schedule' || context.eventName === 'workflow_dispatch') {
              try {
                const clones = await github.request('GET /repos/{owner}/{repo}/traffic/clones', {
                  owner: context.repo.owner,
                  repo: context.repo.repo
                });
                const since = Date.now() - 24 * 60 * 60 * 1000;
                const recent = (clones.data.clones || []).filter(c => new Date(c.timestamp).getTime() >= since && c.count > 0);
                if (recent.length > 0) {
                  detected = true;
                  const total = recent.reduce((sum, c) => sum + c.count, 0);
                  details.push(`Recent clone/download activity in last 24h: ${total}`);
                }
              } catch (error) {
                details.push(`Could not read traffic clones API: ${error.message}`);
              }
            }

            core.setOutput('detected', String(detected));
            core.setOutput('details', details.length ? details.join('; ') : 'No recent download activity detected');

      - name: Send alert to webhook
        if: steps.ai.outputs.detected == 'true' || steps.downloads.outputs.detected == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.ACTIVITY_ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "No ACTIVITY_ALERT_WEBHOOK_URL configured; skipping webhook notification."
            exit 0
          fi
          message="[${GITHUB_REPOSITORY}] activity alert on ${GITHUB_EVENT_NAME} by ${GITHUB_ACTOR}. AI: ${{ steps.ai.outputs.details }}. Downloads: ${{ steps.downloads.outputs.details }}"
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"${message}\"}" \
            "$WEBHOOK_URL"

      - name: Optionally comment on alert issue
        if: (steps.ai.outputs.detected == 'true' || steps.downloads.outputs.detected == 'true') && vars.ACTIVITY_ALERT_ISSUE_NUMBER != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number(process.env.ALERT_ISSUE_NUMBER);
            if (!issueNumber) return;
            const body = [
              `⚠️ Activity alert for @${context.actor}`,
              `- Event: ${context.eventName}`,
              `- AI indicators: ${process.env.AI_DETAILS}`,
              `- Download indicators: ${process.env.DOWNLOAD_DETAILS}`,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });
        env:
          ALERT_ISSUE_NUMBER: ${{ vars.ACTIVITY_ALERT_ISSUE_NUMBER }}
          AI_DETAILS: ${{ steps.ai.outputs.details }}
          DOWNLOAD_DETAILS: ${{ steps.downloads.outputs.details }}
